name: CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-mobile:
    name: Frontend, mobile and workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tooling
      - run: pnpm --filter @mizu/frontend test
      - run: pnpm --filter @mizu/mobile test
      - run: pnpm --filter @mizu/frontend lint
      - run: pnpm check-types
      - run: pnpm --filter @mizu/frontend build
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:1/mizu_build
          RAYON_NUM_THREADS: 4
          CIRCLE_NODE_TOTAL: 4
          NODE_OPTIONS: --max-old-space-size=4096
  audit:
    name: Full workspace dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
  backend:
    name: Go unit and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuhabit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: |
            apps/backend/go.sum
            apps/backend/third_party/*/go.sum
            apps/backend/third_party/provenance.json
      - run: go -C apps/backend/third_party/compat test ./...
      - run: make -C apps/backend audit
      - run: make -C apps/backend lint
      - name: Generated route manifest
        run: |
          go -C apps/backend run ./cmd/api -routes > "$RUNNER_TEMP/go-routes.json"
          diff -u apps/frontend/src/lib/go-routes.generated.json "$RUNNER_TEMP/go-routes.json"
      - name: Prepare database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
      - run: pnpm db:migrate:apply
      - run: pnpm test:integration
